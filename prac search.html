<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>세션 스토리지에 구입 리스트 검색</title>
</head>

<body>
    <h1>세션 스토리지에 구입 리스트 검색</h1>
    <form id="searchForm">
        <label for="searchItem">품목명: </label>
        <input type="text" id="searchItem" required>
        <button type="submit">검색</button>
    </form>
    <p id="result"></p>
    <script>
        document.getElementById('searchForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const searchItem = document.getElementById('searchItem').value;


            const itemCount = sessionStorage.getItem(searchItem);
            const result = document.getElementById('result');

            if (itemCount) {
                result.textContent = `${searchItem} : ${itemCount}개`;
            } else {
                result.textContent = `${searchItem}가 세션 스토리지에 없습니다.`;
            }
        });
    </script>
</body>

</html>
